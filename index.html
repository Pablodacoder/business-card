<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paul Cobourne — Business Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="stage">
    <div class="card">

      <!-- background syntax texture -->
      <div class="texture" aria-hidden="true">
        <span>&lt;/&gt;</span>
        <span>{ }</span>
        <span>;</span>
        <span>( )</span>
        <span>#</span>
      </div>

      <!-- comment-style file header, nods to the repo this card lives in -->
      <div class="file-comment">// b_card.tsx</div>

      <div class="logo">PC</div>

      <div class="identity">
        <img class="photo" src="images/profile.jpeg" alt="Photo of Paul Cobourne">
        <div class="name-block">
          <h1 class="name">Paul Cobourne</h1>
          <p class="title">Computer Science Student</p>
        </div>
      </div>

      <div class="rule">// ---------------------------------</div>

      <dl class="fields">
        <div class="field">
          <dt>email</dt>
          <dd>paulcobourne@gmail.com</dd>
        </div>
        <div class="field">
          <dt>phone</dt>
          <dd>(555) 123-4567</dd>
        </div>
        <div class="field">
          <dt>addr</dt>
          <dd>Brooklyn, NY</dd>
        </div>
        <div class="field">
          <dt>hours</dt>
          <dd>Mon–Fri · 9am–5pm</dd>
        </div>
      </dl>

    </div>
  </div>

</body>
</html>
